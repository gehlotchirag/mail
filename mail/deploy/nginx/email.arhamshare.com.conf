server {
    listen 80;
    server_name email.arhamshare.com;

    client_max_body_size 100M;
    proxy_set_header Accept-Encoding "";
    sub_filter_once off;
    # Only filter HTML/CSS - NOT JS or JSON (would break JMAP capability URNs)
    sub_filter_types text/html text/css;
    sub_filter "Stalwart" "Flux";

    # Custom Flux logo (transparent background, red text)
    location = /logo {
        default_type image/svg+xml;
        return 200 "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 360 110\"><text x=\"180\" y=\"70\" text-anchor=\"middle\" font-family=\"Arial, Helvetica, sans-serif\" font-size=\"54\" font-weight=\"700\" fill=\"#db2d54\">FLUX</text></svg>";
    }

    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300;
        proxy_send_timeout 300;
        proxy_buffering off;
    }
}
